// SPDX-License-Identifier: MIT

plugins {
    id 'java-library'
    id 'checkstyle'
    id 'maven-publish'
    id 'io.github.janguenter.bluemap-addon.java-conventions'
}

group = addon_group
version = addon_version

base {
    archivesName = artifact_id
}

sourceSets {
    main.java.srcDir 'modules/bluemap-athena-resource-models/src/main/java'
    main.java.srcDir 'modules/bluemap-addon-render-core/src/main/java'
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://repo.bluecolored.de/releases')
        content { includeGroupByRegex('de\\.bluecolored.*') }
    }
}

dependencies {
    compileOnly "de.bluecolored:bluemap-core:${bluemap_version}"
    compileOnly 'org.jetbrains:annotations:23.0.0'

    testImplementation "de.bluecolored:bluemap-core:${bluemap_version}"
    testImplementation 'org.jetbrains:annotations:23.0.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(AbstractArchiveTask).configureEach {
    includeEmptyDirs = false
}

tasks.named('test', Test).configure {
    def chippedJar = providers.gradleProperty('chippedJar')
    def athenaJar = providers.gradleProperty('athenaJar')
    if (chippedJar.isPresent()) {
        systemProperty 'chippedJar', chippedJar.get()
    }
    if (athenaJar.isPresent()) {
        systemProperty 'athenaJar', athenaJar.get()
    }
}

tasks.named('processResources').configure {
    inputs.property('version', project.version)
    filesMatching('bluemap.addon.json') {
        expand(version: project.version)
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
                'Automatic-Module-Name': 'io.github.janguenter.bluemap.chipped',
                'Implementation-Title': addon_name,
                'Implementation-Version': project.version.toString()
        )
    }
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-bluemap-chipped-addon' }
    }
    from('NOTICE.md') {
        into 'META-INF'
        rename { 'NOTICE-bluemap-chipped-addon.md' }
    }
    from('THIRD_PARTY.md') {
        into 'META-INF'
        rename { 'THIRD_PARTY-bluemap-chipped-addon.md' }
    }
    from('provenance/upstreams.json') {
        into 'META-INF/bluemap-chipped'
    }
}

tasks.named('sourcesJar', Jar).configure {
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-bluemap-chipped-addon' }
    }
    from('NOTICE.md') {
        into 'META-INF'
        rename { 'NOTICE-bluemap-chipped-addon.md' }
    }
    from('THIRD_PARTY.md') {
        into 'META-INF'
        rename { 'THIRD_PARTY-bluemap-chipped-addon.md' }
    }
    from('provenance/upstreams.json') {
        into 'META-INF/bluemap-chipped'
    }
}

def productionJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
def publishedSourcesJar = tasks.named('sourcesJar', Jar).flatMap { it.archiveFile }
def sharedAthenaPackage = 'io/github/janguenter/bluemap/resource/athena/model/'
def sharedAthenaClasses = [
        "${sharedAthenaPackage}CtmConnections.class",
        "${sharedAthenaPackage}CtmSelector.class",
        "${sharedAthenaPackage}CtmTextureRole.class",
        "${sharedAthenaPackage}CubeFace.class",
        "${sharedAthenaPackage}CubeFace\$Vec.class"
].collect { it.toString() }
def sharedAthenaSources = [
        "${sharedAthenaPackage}CtmConnections.java",
        "${sharedAthenaPackage}CtmSelector.java",
        "${sharedAthenaPackage}CtmTextureRole.java",
        "${sharedAthenaPackage}CubeFace.java"
].collect { it.toString() }
def legacyAthenaClasses = [
        'io/github/janguenter/bluemap/chipped/model/CtmConnections.class',
        'io/github/janguenter/bluemap/chipped/model/CtmSelector.class',
        'io/github/janguenter/bluemap/chipped/model/CtmTextureRole.class',
        'io/github/janguenter/bluemap/chipped/model/CubeFace.class',
        'io/github/janguenter/bluemap/chipped/model/CubeFace$Vec.class'
]
def legacyAthenaSources = legacyAthenaClasses.collect {
    it.replace('.class', '.java').replace('$Vec.java', '.java')
}.unique()
def sharedRenderCorePackage =
        'io/github/janguenter/bluemap/addon/render/core/adapter/bluemap522/'
def sharedRenderCoreClasses = [
        "${sharedRenderCorePackage}FaceLighting.class",
        "${sharedRenderCorePackage}FaceLighting\$Sample.class"
].collect { it.toString() }
def sharedRenderCoreSources = [
        "${sharedRenderCorePackage}FaceLighting.java"
].collect { it.toString() }
def legacyRenderCoreClasses = [
        'io/github/janguenter/bluemap/chipped/adapter/bluemap522/FaceLighting.class',
        'io/github/janguenter/bluemap/chipped/adapter/bluemap522/FaceLighting$Sample.class'
]
def legacyRenderCoreSources = [
        'io/github/janguenter/bluemap/chipped/adapter/bluemap522/FaceLighting.java'
]
tasks.register('verifyProductionJar') {
    dependsOn tasks.named('jar')
    inputs.file(productionJar)

    doLast {
        def jarFile = inputs.files.singleFile
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def archiveEntries = zip.entries().collect { it.name }
            def entries = zip.entries().findAll { !it.directory }.collect { it.name }
            def required = [
                    'bluemap.addon.json',
                    'assets/bluemap_chipped/blockstates/athena_shape.json',
                    'bluemap-chipped/profiles/exact-artifacts.json',
                    'bluemap-chipped/profiles/chipped/4.0.2-athena-4.0.6/profile.json',
                    'bluemap-chipped/profiles/chipped/4.0.2-athena-4.0.6/definitions.tsv',
                    'bluemap-chipped/profiles/chipped/4.0.2-athena-4.0.6/required-resources.tsv',
                    'META-INF/LICENSE-bluemap-chipped-addon',
                    'META-INF/NOTICE-bluemap-chipped-addon.md',
                    'META-INF/THIRD_PARTY-bluemap-chipped-addon.md',
                    'META-INF/bluemap-chipped/upstreams.json'
            ] + sharedAthenaClasses + sharedRenderCoreClasses
            def missing = required.findAll { !entries.contains(it) }
            def duplicateShared = sharedAthenaClasses.findAll { shared ->
                entries.count { it == shared } != 1
            } + sharedRenderCoreClasses.findAll { shared ->
                entries.count { it == shared } != 1
            }
            if (!missing.isEmpty() || !duplicateShared.isEmpty()) {
                throw new GradleException(
                        "Production JAR shared boundary mismatch: missing=${missing}, "
                                + "nonUnique=${duplicateShared}"
                )
            }
            def addon = new groovy.json.JsonSlurper().parseText(
                    zip.getInputStream(zip.getEntry('bluemap.addon.json')).getText('UTF-8')
            )
            if (addon.id != addon_id
                    || addon.entrypoint != 'io.github.janguenter.bluemap.chipped.BlueMapChippedAddon'
                    || addon.version != project.version.toString()
                    || addon.dependencies != []
                    || addon['soft-dependencies'] != []) {
                throw new GradleException('BlueMap add-on metadata mismatch')
            }
            def foreignClasses = entries.findAll {
                it.endsWith('.class')
                        && !it.startsWith('io/github/janguenter/bluemap/chipped/')
                        && !sharedAthenaClasses.contains(it)
                        && !sharedRenderCoreClasses.contains(it)
            }
            def forbidden = archiveEntries.findAll {
                it.endsWith('.jar')
                        || it == 'META-INF/neoforge.mods.toml'
                        || it == 'fabric.mod.json'
                        || it.endsWith('.mixins.json')
                        || it.startsWith('assets/chipped/')
                        || it.startsWith('earth/terrarium/')
                        || it.startsWith('de/bluecolored/')
                        || it.startsWith('de/maxhenkel/')
                        || it.startsWith('net/minecraft/')
                        || it.startsWith('net/neoforged/')
                        || legacyAthenaClasses.contains(it)
                        || legacyRenderCoreClasses.contains(it)
                        || (it.startsWith(sharedAthenaPackage) && !it.endsWith('/')
                            && !sharedAthenaClasses.contains(it))
                        || (it.startsWith(sharedRenderCorePackage) && !it.endsWith('/')
                            && !sharedRenderCoreClasses.contains(it))
            }
            if (!foreignClasses.isEmpty() || !forbidden.isEmpty()) {
                throw new GradleException(
                        "Production JAR boundary mismatch: foreignClasses=${foreignClasses}, "
                                + "forbidden=${forbidden}"
                )
            }
            def packagedProvenance = zip.getInputStream(
                    zip.getEntry('META-INF/bluemap-chipped/upstreams.json')
            ).readAllBytes()
            if (!java.util.Arrays.equals(
                    packagedProvenance, file('provenance/upstreams.json').bytes
            )) {
                throw new GradleException('Packaged provenance differs from source lock')
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register('verifySourcesJar') {
    dependsOn tasks.named('sourcesJar')
    inputs.file(publishedSourcesJar)

    doLast {
        def jarFile = inputs.files.singleFile
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def archiveEntries = zip.entries().collect { it.name }
            def entries = zip.entries().findAll { !it.directory }.collect { it.name }
            def required = [
                    'io/github/janguenter/bluemap/chipped/BlueMapChippedAddon.java',
                    'io/github/janguenter/bluemap/chipped/adapter/bluemap522/ChippedRenderer.java',
                    'bluemap.addon.json',
                    'bluemap-chipped/profiles/exact-artifacts.json',
                    'bluemap-chipped/profiles/chipped/4.0.2-athena-4.0.6/profile.json',
                    'bluemap-chipped/profiles/chipped/4.0.2-athena-4.0.6/definitions.tsv',
                    'bluemap-chipped/profiles/chipped/4.0.2-athena-4.0.6/required-resources.tsv',
                    'META-INF/LICENSE-bluemap-chipped-addon',
                    'META-INF/NOTICE-bluemap-chipped-addon.md',
                    'META-INF/THIRD_PARTY-bluemap-chipped-addon.md',
                    'META-INF/bluemap-chipped/upstreams.json'
            ] + sharedAthenaSources + sharedRenderCoreSources
            def missing = required.findAll { !entries.contains(it) }
            def duplicateShared = sharedAthenaSources.findAll { shared ->
                entries.count { it == shared } != 1
            } + sharedRenderCoreSources.findAll { shared ->
                entries.count { it == shared } != 1
            }
            if (!missing.isEmpty() || !duplicateShared.isEmpty()) {
                throw new GradleException(
                        "Sources JAR shared boundary mismatch: missing=${missing}, "
                                + "nonUnique=${duplicateShared}"
                )
            }
            def projectJava = entries.findAll { it.endsWith('.java') }
            def foreignJava = projectJava.findAll {
                !it.startsWith('io/github/janguenter/bluemap/chipped/')
                        && !sharedAthenaSources.contains(it)
                        && !sharedRenderCoreSources.contains(it)
            }
            def forbidden = archiveEntries.findAll {
                it.endsWith('.class')
                        || it.endsWith('.jar')
                        || it.startsWith('assets/chipped/')
                        || it.startsWith('earth/terrarium/')
                        || it.startsWith('de/bluecolored/')
                        || it.startsWith('de/maxhenkel/')
                        || it.startsWith('net/minecraft/')
                        || it.startsWith('net/neoforged/')
                        || legacyAthenaSources.contains(it)
                        || legacyRenderCoreSources.contains(it)
                        || (it.startsWith(sharedAthenaPackage) && !it.endsWith('/')
                            && !sharedAthenaSources.contains(it))
                        || (it.startsWith(sharedRenderCorePackage) && !it.endsWith('/')
                            && !sharedRenderCoreSources.contains(it))
            }
            if (projectJava.isEmpty() || !foreignJava.isEmpty() || !forbidden.isEmpty()) {
                throw new GradleException(
                        "Sources JAR boundary mismatch: foreignJava=${foreignJava}, "
                                + "forbidden=${forbidden}"
                )
            }
            def packagedProvenance = zip.getInputStream(
                    zip.getEntry('META-INF/bluemap-chipped/upstreams.json')
            ).readAllBytes()
            if (!java.util.Arrays.equals(
                    packagedProvenance, file('provenance/upstreams.json').bytes
            )) {
                throw new GradleException('Sources JAR provenance differs from source lock')
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyProductionJar')
    dependsOn tasks.named('verifySourcesJar')
}

tasks.register('verifyPinnedArtifacts', Exec) {
    def chippedJar = providers.gradleProperty('chippedJar')
    def athenaJar = providers.gradleProperty('athenaJar')
    doFirst {
        if (!chippedJar.isPresent() || !athenaJar.isPresent()) {
            throw new GradleException(
                    'Set -PchippedJar and -PathenaJar to the exact ATM 1.2.0 artifacts.'
            )
        }
    }
    commandLine 'python3', 'tools/verify_pinned_artifacts.py',
            '--chipped', chippedJar.getOrElse('missing'),
            '--athena', athenaJar.getOrElse('missing')
}

publishing {
    publications {
        addon(MavenPublication) {
            from components.java
            artifactId = artifact_id
            pom {
                name = addon_name
                description = 'Exact-profile BlueMap rendering for Chipped Athena connected models.'
                url = 'https://github.com/jan-guenter/bluemap-chipped-addon'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://spdx.org/licenses/MIT.html'
                        distribution = 'repo'
                    }
                }
                scm {
                    url = 'https://github.com/jan-guenter/bluemap-chipped-addon'
                    connection = 'scm:git:https://github.com/jan-guenter/bluemap-chipped-addon.git'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/jan-guenter/bluemap-chipped-addon')
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
